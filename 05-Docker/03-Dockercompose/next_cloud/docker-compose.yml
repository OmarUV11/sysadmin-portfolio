services:
              db:
                 container_name: postgres_db 
                 image: postgres
                 restart: always 
                 environment:
                      - POSTGRES_USER=nextuser
                      - POSTGRES_PASSWORD=nextpass
                      - POSTGRES_DB=nextcloud_db
                 volumes:
                      - dbpostres_2:/var/lib/postgresql
                
                 hostname: postgres_db
                 networks:
                         red_nextcloud:
                                     ipv4_address: 192.168.40.2
          
                 
                 healthcheck:
                      test: ["CMD-SHELL","pg_isready -U postgres "]
                      interval: 30s
                      timeout: 5s
                      retries: 3
              app:
                  container_name: nextcloud_
                  image: nextcloud
                  restart: always
                  environment:
                        - POSTGRES_DB=nextcloud_db
                        - POSTGRES_USER=nextuser
                        - POSTGRES_PASSWORD=nextpass
                        - POSTGRES_HOST=db
                  ports:                        
                        - 8080:80
                  volumes:
                        - nextcloud_2:/var/www/html

                  networks:
                         red_nextcloud:
                                    ipv4_address: 192.168.40.3
                  healthcheck:
                        test: ["CMD-SHELL","curl -m http://localhost:8080"]   



volumes:
      dbpostres_2:
      nextcloud_2:

networks:
        red_nextcloud:
                   ipam:
                      config:
                        - subnet: 192.168.40.0/24
